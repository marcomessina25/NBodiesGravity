[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nbodiesgravity"
version = "1.0.1"
description = "Real-time 3D N-body gravitational simulation in PyQt6 and PyOpenGL"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "marcomessina25" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyQt6>=6.5",
    "PyOpenGL>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.23",
]

[project.scripts]
nbodiesgravity = "nbodiesgravity.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["nbodiesgravity*"]

[tool.setuptools.package-data]
nbodiesgravity = ["data/snapshots/*.json"]
