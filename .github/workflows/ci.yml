name: CI

on:
  push:
    branches: [ main, master, "v*" ]
  pull_request:
    branches: [ main, master, "v*" ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Qt6 & OpenGL headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libgl1-mesa-dri \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Syntax and byte-compile check
        run: |
          python -m compileall -q nbodiesgravity tests

      - name: Run unit, engine, rendering, ui, and validation test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -v

      - name: Run headless simulation smoke check
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "from nbodiesgravity.data.loader import load_default_system; sys = load_default_system(); sys.step(1.0); print(f'Stepped {len(sys.bodies)} bodies successfully')"
